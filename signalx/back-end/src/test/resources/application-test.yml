spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:signalx_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    username: ${LOCAL_USERNAME}
    password:

  ${LOCAL_PASSWORD}
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      encoding: UTF-8

  task:
    scheduling:
      enabled: false

notify:
  mail:
    enabled: false

rhythm:
  cos:
    enabled: false
