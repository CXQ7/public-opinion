server:
  port: 8080
rhythm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: ${LOCAL_PASSWORD}
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /user/user/login
      - /user/keyword/list
      - /hello/**
spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1
    gateway:
